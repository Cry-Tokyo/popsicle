[package]
name = "popsicle_cosmic"
version = "0.1.0"
edition = "2021"
authors = ["maybe me no clue"]
description = "USB Flasher"
readme = "README.md"
license = "MIT"

[[bin]]
name = "popsicle_cosmic"
path = "src/main.rs"


[dependencies]
# s
bytesize = "2.0.1"
dbus-udisks2 = { git = "https://github.com/pop-os/dbus-udisks2" }
digest = "0.10.7"
i18n-embed-fl = "0.10.0"
iso9660 = "0.1.1"
# hash
blake2 = "0.10.6"
md-5 = "0.10.6"
rust-embed = "8.7.2"
sha2 = "0.10.9"
sha-1 = "0.10.1"
# logging & rt
tokio = {version = "1", features = ["full"]}
tracing = "0.1.41"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.19"
url = "2.5.4"
atomic = "0.6.1"
dbus = "0.9.7"
bytemuck = "1.23.1"
futures = "0.3.31"
libc = "0.2.174"
futures-channel = "0.3.31"
serde = "1.0.219"


[dependencies.i18n-embed]
version = "0.15.4"
features = ["desktop-requester", "fluent-system"]


[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = ["debug", "tokio", "winit", "xdg-portal"]

[dependencies.popsicle]
path = ".."
